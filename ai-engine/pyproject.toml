[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrace-ai-engine"
version = "0.1.0"
description = "FinTrace AI Engine: Structured financial claim extraction, falsifiability compilation, dual-model orchestration, and interpretation fork analysis."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Venkat Rajh P R", email = "venkatrajh555@gmail.com" }
]
keywords = [
    "finance",
    "claim-extraction",
    "falsifiability",
    "interpretation-forks",
    "dual-model-orchestration",
    "llm",
    "groq",
    "gemini"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
py-modules = ["engine_interface", "facade"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "claim_extraction*",
    "providers*",
    "orchestration*",
    "interpretation*",
    "validation*",
    "fallback*",
    "assessment*",
]
exclude = [
    "tests*",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
